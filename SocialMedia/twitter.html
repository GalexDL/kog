<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KoG Archive - @knights_cygames</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
    
    <div class="profile-container">

        <div class="Tweet-shell"> 
            <div class="Tweet-search-header">
                <i class="bi bi-search Tweet-search-icon"></i>
                <input type="text" class="Tweet-search-input" id="TweetSearch" placeholder="Search...">
            </div>
        </div>
        
        <header class="profile-header">
            <div class="profile-banner"></div>
            <div class="profile-meta">
                <div class="profile-avatar"></div>
                <div class="profile-info">
                    <h1 class="profile-name">ナイツオブグローリー公式</h1>
                    <p class="profile-handle">@knights_cygames</p>
                    <p class="profile-bio">「ナイツオブグローリー」公式Twitterアカウントです。闘技場のショップ店員「ニーナ」がつぶやきます。<br><br>※お客様からの個別のメッセージなどは、Twitter上ではご返答できかねますのでご了承ください。</p>
                    <div class="profile-details">
                        <span><i class="bi bi-link-45deg"></i> <a href="https://x.com/knights_cygames" target="_blank">Twitter</a></span>
                        <span><i class="bi bi-calendar3"></i> Joined November 2013 </span>
                    </div>
                </div>
            </div>
            <nav class="profile-tabs">
                <div class="tab active">Tweets</div>
                <div class="tab">Media</div>
            </nav>
        </header>

        <main id="tweet-feed" class="tweet-feed">
        </main>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
