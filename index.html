<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>KoG Archive</title>
        <link rel="shortcut icon" type="image/png" href="data/Images/favicon.png">
        <link rel="stylesheet" href="style.css">
        <script src="script.js"></script>

                        <p>Artbook</p>

                    <button class="HomeBarBTN" data-page="WS-SocialMedia">

                        </svg>
                        <p>Twitter</p>
                    </button>
                    <button class="HomeBarBTN" data-page="WS-Music">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-music-note-list" viewBox="0 0 16 16">

                            </svg>
                        <p>Music</p>
                    </button>
                    <button class="HomeBarBTN" data-page="WS-SiteArchive">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-archive" viewBox="0 0 16 16">

                        </svg>
                        <p>OG Site Archive</p>
                    </button>
                    <button class="HomeBarBTN" data-page="WS-Contributions">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-people-fill" viewBox="0 0 16 16">

                </div>
            </div>

            <div class="MainCanvas1">
                <button class="CanvasFullscreenBTN" aria-label="Enter Fullscreen">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrows-fullscreen" viewBox="0 0 16 16">
                        <path fill-rule="evenodd" d="M5.828 10.172a.5.5 0 0 0-.707 0l-4.096 4.096V11.5a.5.5 0 0 0-1 0v3.975a.5.5 0 0 0 .5.5H4.5a.5.5 0 0 0 0-1H1.732l4.096-4.096a.5.5 0 0 0 0-.707m4.344 0a.5.5 0 0 1 .707 0l4.096 4.096V11.5a.5.5 0 1 1 1 0v3.975a.5.5 0 0 1-.5.5H11.5a.5.5 0 0 1 0-1h2.768l-4.096-4.096a.5.5 0 0 1 0-.707m0-4.344a.5.5 0 0 0 .707 0l4.096-4.096V4.5a.5.5 0 1 0 1 0V.525a.5.5 0 0 0-.5-.5H11.5a.5.5 0 0 0 0 1h2.768l-4.096 4.096a.5.5 0 0 0 0 .707m-4.344 0a.5.5 0 0 1-.707 0L1.025 1.732V4.5a.5.5 0 0 1-1 0V.525a.5.5 0 0 1 .5-.5H4.5a.5.5 0 0 1 0 1H1.732l4.096 4.096a.5.5 0 0 1 0 .707"/>
                    </svg>
                </button>
                <!-- Home Page-->
                <div class="page" id="page-WS-Home">
                    <div class="HomePageIntro">
                        <img class="HomePageLogo" src="data/Images/logo.webp" alt="World Seed Logo">
                        <h1 class="HomePageTitle">Knights of Glory Archive</h1>
                        <p class="HomePageSub">An archival website dedicated to perserving imagery and other data from Knights of Glory</p>
                        <p class="HomePageDesc">Use the side/top bar to navigate to the site</p>
                    </div>
                </div>

                <!-- Additional Pages-->
                <div class="page" id="page-WS-Wiki" style="display:none;">
                    <iframe class="CatalogFrame" data-src="./Wiki/" title="Wiki" loading="lazy"></iframe>
                </div>
                <div class="page" id="page-WS-Artbook" style="display:none;">
                    <iframe class="CatalogFrame" data-src="./Artbook/" title="Artbook" loading="lazy"></iframe>
                </div>
                <div class="page" id="page-WS-SocialMedia" style="display:none;">
                    <iframe class="CatalogFrame" data-src="./SocialMedia/" title="Twitter" loading="lazy"></iframe>
                </div>
                <div class="page" id="page-WS-Music" style="display:none;">
                    <iframe class="CatalogFrame" data-src="./Music/" title="Music" loading="lazy"></iframe>
                </div>
                <div class="page" id="page-WS-Contributions" style="display:none;">
                    <iframe class="CatalogFrame" data-src="./Contributions/" title="About" loading="lazy"></iframe>
                </div>
                <div class="page" id="page-WS-SiteArchive" style="display:none;">
                    <div class="flash-container">
                        <iframe class="ArchiveFrame" data-src="./SiteArchive/" title="OG Site Archive" scrolling="no" loading="lazy"></iframe>
                    </div> 
                </div> 
                

        </div>
    </body>
</html>
