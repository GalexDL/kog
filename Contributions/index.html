<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contributions - KoG Archive</title>
    <link rel="shortcut icon" type="image/png" href="../Images/favicon.png">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
  </head>

<body>
  <div class="page">

    <div class="contrib-header">
      <h1>Contributions</h1>
    </div>

    <div class="contrib-stats">
      <div class="stat-card">
        <div class="stat-value" id="contrib-count">—</div>
        <div class="stat-label">Contributors</div>
      </div>
    </div>

    <p class="contrib-section-title">Contributors</p>

    <div class="contrib-list" id="contrib-list"></div>

    <div class="how-to">
      <p class="contrib-section-title" style="border:none; padding:0; margin-bottom:4px;">How to Contribute</p>
      <p>This project needs a massive amount of data, if you have images, game data, story stuff, or even the app please tweet to @LostGalex on twitter (DMs are a mess). </p>
    </div>

    <p class="contrib-section-title">Website Update Notes</p>

    <div class="patch-filters">
      <button class="patch-filter-btn active" data-filter="all">All</button>
      <button class="patch-filter-btn" data-filter="wiki">Wiki</button>
      <button class="patch-filter-btn" data-filter="artbook">Artbook</button>
      <button class="patch-filter-btn" data-filter="social-media">Social Media</button>
    </div>

    <div class="patch-list" id="patch-list"></div>

    <p class="placeholder-notice">Updates are Irregular</p>

    <p class="contrib-section-title">Sources</p>

    <div class="source-list" id="source-list"></div>

  </div>
</body>
</html>
